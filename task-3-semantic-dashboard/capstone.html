<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Shopping Store</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f1f5f9;
  text-align: center;
}

header {
  background: #2563eb;
  color: white;
  padding: 20px;
}

input, button {
  padding: 10px;
  margin: 8px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

button {
  background: #2563eb;
  color: white;
  cursor: pointer;
}

.products {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
}

.card {
  background: white;
  width: 200px;
  margin: 15px;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 3px 10px #ccc;
}

@media(max-width: 600px) {
  .card { width: 80%; }
}
</style>
</head>

<body>

<header>
<h1>My Shopping Store</h1>
<p>Welcome to Online Shopping</p>
<button onclick="login()">Login</button>
</header>

<h2>Our Products</h2>

<input id="search" placeholder="Search products..."
oninput="displayProducts()">

<button onclick="addProduct()">Add Product</button>

<div class="products" id="products"></div>

<h2>Shopping Cart</h2>
<div id="cart"></div>

<script>
let products = JSON.parse(localStorage.getItem("products")) || [
 {id:1, name:"Laptop", price:45000},
 {id:2, name:"Headphones", price:1500},
 {id:3, name:"Smart Watch", price:2500}
];

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function saveData() {
 localStorage.setItem("products", JSON.stringify(products));
 localStorage.setItem("cart", JSON.stringify(cart));
}

function displayProducts() {
 let search = document.getElementById("search").value.toLowerCase();

 document.getElementById("products").innerHTML =
 products.filter(p => p.name.toLowerCase().includes(search))
 .map(p => `
 <div class="card">
 <h3>${p.name}</h3>
 <p>Price: ₹${p.price}</p>
 <button onclick="addCart(${p.id})">Add to Cart</button>
 <button onclick="editProduct(${p.id})">Edit</button>
 <button onclick="deleteProduct(${p.id})">Delete</button>
 </div>
 `).join("");
}

function addCart(id) {
 cart.push(products.find(p => p.id === id));
 saveData();
 displayCart();
}

function displayCart() {
 document.getElementById("cart").innerHTML =
 cart.map(p => `<p>${p.name} - ₹${p.price}</p>`).join("");
}

function addProduct() {
 let name = prompt("Enter product name:");
 let price = Number(prompt("Enter product price:"));

 if(name && Number.isFinite(price) && price > 0) {
 products.push({id:Date.now(), name, price});
 saveData();
 displayProducts();
 }
}

function editProduct(id) {
 let p = products.find(p => p.id === id);
 let name = prompt("New product name:", p.name);

 if(name) {
 p.name = name;
 saveData();
 displayProducts();
 }
}

function deleteProduct(id) {
 products = products.filter(p => p.id !== id);
 saveData();
 displayProducts();
}

function login() {
 let name = prompt("Enter your name:");
 if(name) alert("Welcome " + name);
}

displayProducts();
displayCart();
</script>

</body>
</html>
